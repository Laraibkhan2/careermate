name: careermate
description: "CareerMate: job matching, skill gaps and application tracking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  firebase_core: ^5.2.0
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  google_fonts: ^8.2.1
  firebase_messaging: ^17.1.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
